name: Scout-02

on:
  repository_dispatch:
    types: [fire_Scout-02]

jobs:
  muscle-node:
    runs-on: ubuntu-latest-arm64
    if: github.event_name == 'repository_dispatch'
    steps:
      - name: Fact-Check RAM
        run: free -h

      - name: Setup OpenSSH Server
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          sudo systemctl enable ssh

      - name: The 'OpenSSH' Stealth Bridge
        env:
          GCP_IP: ${{ secrets.GCP_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_PUBLIC_KEY" > ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh -o StrictHostKeyChecking=no -f -N -R 2223:localhost:22 gcp-user@${GCP_IP}

      - name: Zero-Egress 'Drive-Direct' Pipeline (Pull)
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "$GDRIVE_CREDENTIALS" > gdrive_credentials.json
          sudo apt-get update
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          cat <<EOT > ~/.config/rclone/rclone.conf
[gdrive]
type = drive
scope = drive
service_account_file = $(pwd)/gdrive_credentials.json
EOT
          rclone sync gdrive:assets ./assets

      - name: Render 4K Video
        run: |
          echo "Executing 6-hour render..."
          sleep 21600

      - name: Zero-Egress 'Drive-Direct' Pipeline (Push)
        run: |
          echo "Uploading the final 15-min 4K render to Drive..."
          rclone sync ./render gdrive:renders
          rm -f gdrive_credentials.json
